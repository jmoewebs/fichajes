# Se ejecuta solo cada hora en GitHub: descarga noticias, guarda el histórico
# y publica la web en Cloudflare Pages. También se puede lanzar a mano desde la pestaña Actions.
name: Actualizar web

on:
  schedule:
    # Horas en UTC, pensadas para el horario de INVIERNO de España (CET = UTC+1). Solo publica si hay titulares nuevos.
    # El domingo 28 de marzo de 2027 España pasa a horario de verano (UTC+2) y todo se adelanta una hora
    # (de día, de 08:07 a 00:07; de madrugada, 03:07 y 06:07). Si quieres mantener 07:07-23:07, cambia entonces
    # "6-22" por "5-21" y "1,4" por "0,3". El domingo 31 de octubre de 2027 vuelve el horario de invierno.
    - cron: "7 6-22 * * *"   # cada hora de 07:07 a 23:07 (hora de España en invierno)
    - cron: "7 1,4 * * *"    # madrugada, cada 3 horas: 02:07 y 05:07 (hora de España en invierno)
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano
    inputs:
      bienvenida_telegram:
        description: "Enviar el mensaje de bienvenida al canal de Telegram"
        type: boolean
        default: false
      comprobar_seo:
        description: "Ejecutar la comprobación de SEO (comprobar_seo.py) antes de publicar"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actualizar-web
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (para los iconos)
        run: pip install pillow

      - name: Descargar noticias y generar la web
        id: run
        run: python run.py
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}   # para publicar el archivo de la clave en la web

      - name: Añadir ads.txt y código de AdSense
        run: |
          cp estatico/ads.txt web/ads.txt
          for f in web/*.html; do
            sed -i 's#</head>#<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6680488121204410" crossorigin="anonymous"></script></head>#' "$f"
          done

      - name: Publicar la clave de IndexNow en la web
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY" ]; then
            echo "::warning::Falta el secreto INDEXNOW_KEY (Settings > Secrets and variables > Actions). No se publica la clave de IndexNow."
            exit 0
          fi
          test -n "$INDEXNOW_KEY" && printf '%s' "$INDEXNOW_KEY" > "web/$INDEXNOW_KEY.txt"

      - name: Mensaje de bienvenida en Telegram (solo si lo marcas al lanzarlo a mano)
        if: github.event_name == 'workflow_dispatch' && inputs.bienvenida_telegram
        run: python run.py telegram-bienvenida
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Rumores pendientes de revisión (solo informativo)
        run: python run.py review

      - name: Guardar el histórico en el repositorio
        run: |
          git config user.name "actualizador"
          git config user.email "actualizador@users.noreply.github.com"
          for f in fichajes.db jugadores.csv ignorados.txt clasificaciones.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "::warning::No existe $f, no se añade al commit"
            fi
          done
          git diff --cached --quiet || git commit -m "Actualización automática"
          if ! git pull --rebase; then
            git rebase --abort || true
            echo "::error::git pull --rebase falló (posible conflicto, p. ej. en fichajes.db). Rebase abortado; no se sube nada."
            exit 1
          fi
          git push

      # Comprobación de SEO (equivale a la skill revisar-seo-antes-de-subir). DESACTIVADA en las ejecuciones
      # automáticas: solo corre si la lanzas a mano marcando "comprobar_seo", o si creas la variable de
      # repositorio SEO_CHECK_ENABLED=true (Settings > Secrets and variables > Actions > Variables).
      # Para que un fallo bloquee la publicación en producción, crea además SEO_CHECK_BLOQUEA=true;
      # sin ella, solo avisa (el paso falla en rojo pero no impide publicar).
      - name: Comprobar SEO de la web generada
        if: (github.event_name == 'workflow_dispatch' && inputs.comprobar_seo) || vars.SEO_CHECK_ENABLED == 'true'
        continue-on-error: ${{ vars.SEO_CHECK_BLOQUEA != 'true' }}
        run: python comprobar_seo.py web

      - name: Publicar en Cloudflare Pages
        if: steps.run.outputs.nuevos != '0' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Avisar a Bing de las páginas que han cambiado (IndexNow, tras cada publicación)
        if: steps.run.outputs.nuevos != '0' || github.event_name == 'workflow_dispatch'
        run: python run.py indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
